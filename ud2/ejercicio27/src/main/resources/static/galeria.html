<main>
    <h2>Galería</h2>
    <p>Fotos del colectivo y de sus dos caras más conocidas: C. Tangana y Sticky M.A.</p>

    <div class="galeria">
        <figure>
            <img src="img/agorazein-grupo.jpg" alt="Agorazein, foto de grupo en un sofá">
            <figcaption>
                <strong>El grupo.</strong>
                Foto de Agorazein de la época de <em>Siempre</em>. Los cinco juntos, en casa, con la estética de entonces: chándal, camisetas y el rollo de colectivo de barrio, no de estrella en solitario.
            </figcaption>
        </figure>

        <figure>
            <img src="img/sticky-ma.jpg" alt="Retrato de Sticky M.A.">
            <figcaption>
                <strong>Sticky M.A.</strong>
                Antes Manto. En <em>Siempre</em> lleva temas propios como <em>To Pue' Ser</em>, <em>Ángel</em> y <em>Guadalupe</em>, y comparte casi todo el disco con C. Tangana.
            </figcaption>
        </figure>

        <figure>
            <img src="img/c-tangana.jpg" alt="Retrato de C. Tangana con gafas rojas">
            <figcaption>
                <strong>C. Tangana.</strong>
                Antón Álvarez, antes Crema. La C del nombre viene de ese alias. Es la cara más visible de AGZ y quien después se hizo famoso en solitario.
            </figcaption>
        </figure>

        <figure>
            <img src="img/tangana-directo.jpg" alt="C. Tangana cantando en un concierto">
            <figcaption>
                <strong>En directo.</strong>
                C. Tangana con el micro. El colectivo cerró etapa tras <em>Siempre</em> (2016) y la gira de 2017. En 2026 vuelven juntos al Movistar Arena de Madrid.
            </figcaption>
        </figure>
    </div>
</main>
